# SDD configuration for arquitectura-casa-alta-web
# Written by sdd-init. Re-running init updates this file; read it before editing.

schema: spec-driven

context: |
  Hybrid repo: a Next.js 16 site plus the image-asset pipeline that feeds it.
  Stack: Next.js 16.3.5 (App Router, Turbopack), React 19.2.8, TypeScript 5 strict,
  Tailwind v4 CSS-first (@theme in src/app/globals.css), ESLint 9, pnpm (node_modules
  links into .pnpm/; package-lock.json is stale npm residue), Netlify deploy with no
  netlify.toml yet, and no test runner. Gates: tsc --noEmit, eslint, next build, check:images.
  Architecture: atomic design under src/components/{atoms,molecules,organisms,templates};
  content seam at src/lib/content/index.ts, the only reader pages call, so components take
  props only and Payload CMS can later replace the source; a custom next/image loader at
  src/lib/image/loader.ts serves pre-encoded AVIF tiers from variants.generated.json
  (generated by tools/sync-images.mjs).

strict_tdd: false

projects:
  - path: "."
    stack: "Next.js 16.3.5 (App Router, Turbopack) / React 19.2.8 / TypeScript 5 strict / Tailwind CSS v4"
    test_command: ""
    test_framework: "none -- no test runner installed"
    build_command: "npx next build"
    quality_commands:
      typecheck: "npx tsc --noEmit"
      lint: "npm run lint"
      images: "npm run check:images"
    layers:
      unit: false
      integration: false
      e2e: false
    coverage: ""

testing:
  strict_tdd: false
  detected: "2026-09-16"
  reason: >
    No test runner is configured. package.json declares no test script and no test
    dependency (no vitest, jest, playwright or cypress), and the repository contains
    zero test or spec files. Per the Strict TDD resolution rules this fails closed to
    false, because no workspace-level test command covers the project. Downstream
    phases MUST NOT assume a RED-GREEN-REFACTOR cycle is available and MUST NOT
    invent a test runner as a side effect of another change.
  gates_that_exist:
    - "npx tsc --noEmit      -- type checker, wired as `npm run typecheck`"
    - "npm run lint          -- ESLint 9, next/core-web-vitals + next/typescript"
    - "npx next build        -- production build; runs tools/sync-images.mjs via prebuild"
    - "npm run check:images  -- bespoke check: every emitted image URL must resolve"
  package_manager_note: >
    pnpm laid down the current node_modules (node_modules/.bin/* symlink into .pnpm/,
    and pnpm-lock.yaml is the newer lockfile). The `npm run <script>` forms above work
    because they only read package.json; `pnpm run <script>` is equivalent and idiomatic here.

rules:
  proposal:
    - Include a rollback plan for risky changes.
    - "State which repository constraints the change could touch before proposing scope -- the
      numeric path prefixes, the read-only images/ tree, and image-pipeline ownership of
      images-optimizado/."
    - Do not propose a change that renumbers a published project folder or photo ordinal; that
      changes public URLs and discards accumulated search ranking.
  specs:
    - Use Given/When/Then for scenarios.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
  design:
    - Document architecture decisions with rationale; never silently reverse a decision that
      CLAUDE.md or a code comment records as measured.
    - "Preserve the content seam: src/lib/content/index.ts stays the only reader, and components
      keep receiving props only. A Payload CMS migration is a change to that file, not to components."
    - "Preserve the custom image loader contract in src/lib/image/loader.ts: never reintroduce
      Netlify Image CDN, and never re-encode the JPEG fallback. WebP q82 measurably grows this
      corpus (100-102% of the original)."
    - "Preserve the deviceSizes tiers starting at 480. Next's defaults start at 640, which makes
      the 480 tier unreachable and doubles what a phone downloads."
    - "Tiering variants by LONG edge is a known, bounded pipeline limitation, not a site bug; the
      fix belongs in the pipeline, not in next.config.ts or the loader."
    - Include sequence diagrams for complex flows.
  tasks:
    - Group by phase, use hierarchical numbering.
    - Keep tasks completable in one session.
    - Never plan a task that renames a path changing a numeric prefix, or that writes under images/.
    - Never plan `git add -A`; stage deliberately after a pipeline run.
  apply:
    guidelines:
      - Follow existing code patterns.
      - "images/ is read-only, including in git: never write, rename or delete a file already
        tracked there."
      - Reordering photos is the `order` field in manifest.json, never a filesystem rename.
      - Never add Co-Authored-By or any AI attribution to a commit in this repository.
      - Route images-optimizado/ regeneration through tools/; never hand-edit generated output.
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: "npx next build"
    coverage_threshold: 0
    additional_gates:
      - "npx tsc --noEmit"
      - "npm run lint"
      - "npm run check:images"
  archive:
    - Warn before merging destructive deltas.
    - Never renumber a published project or photo path while syncing specs at archive time.
